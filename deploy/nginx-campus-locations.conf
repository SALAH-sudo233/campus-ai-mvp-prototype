# server 级配置，放到 /etc/nginx/campus-locations.conf，在 campusgo.aihuanxi.ai 的 server 块里 include。
# 限流区只挂在 /app/ 下，不影响 / 和 /dashboard 上的中转站。
location = /app {
    return 301 /app/;
}

# 静态页面与前端资源单独使用宽松限流，避免连续刷新或加载作品图挤占 API 配额。
location = /app/ {
    limit_req zone=campus_static burst=200 nodelay;
    limit_req_status 429;
    limit_conn campus_conn 50;
    proxy_pass http://campus_prototype/;
    include /etc/nginx/campus-proxy-common.conf;
}

location ^~ /app/media/ {
    limit_req zone=campus_static burst=200 nodelay;
    limit_req_status 429;
    limit_conn campus_conn 50;
    proxy_pass http://campus_prototype/media/;
    include /etc/nginx/campus-proxy-common.conf;
}

location ^~ /app/hosted/ {
    limit_req zone=campus_static burst=200 nodelay;
    limit_req_status 429;
    limit_conn campus_conn 50;
    proxy_pass http://campus_prototype/hosted/;
    include /etc/nginx/campus-proxy-common.conf;
}

location ^~ /app/packages/ {
    limit_req zone=campus_static burst=200 nodelay;
    limit_req_status 429;
    limit_conn campus_conn 50;
    proxy_pass http://campus_prototype/packages/;
    include /etc/nginx/campus-proxy-common.conf;
}

location ~ ^/app/(?:(?:admin|teacher|import|gallery)|[^/]+\.(?:html|css|js)|cli/campus-cli|skills/campus-platform/SKILL\.md)$ {
    limit_req zone=campus_static burst=200 nodelay;
    limit_req_status 429;
    limit_conn campus_conn 50;
    rewrite ^/app/(.*)$ /$1 break;
    proxy_pass http://campus_prototype;
    include /etc/nginx/campus-proxy-common.conf;
}

location /app/api/register {
    limit_req zone=campus_register burst=3 nodelay;
    limit_req_status 429;
    client_max_body_size 64k;
    proxy_pass http://campus_prototype/api/register;
    include /etc/nginx/campus-proxy-common.conf;
}

location /app/api/login {
    limit_req zone=campus_login burst=5 nodelay;
    limit_req_status 429;
    client_max_body_size 64k;
    proxy_pass http://campus_prototype/api/login;
    include /etc/nginx/campus-proxy-common.conf;
}

location /app/api/admin/login {
    limit_req zone=campus_admin burst=1 nodelay;
    limit_req_status 429;
    client_max_body_size 64k;
    proxy_pass http://campus_prototype/api/admin/login;
    include /etc/nginx/campus-proxy-common.conf;
}

location ~ ^/app/api/orgs/[^/]+/imports/preview$ {
    limit_req zone=campus_api burst=10 nodelay;
    limit_req_status 429;
    client_max_body_size 10m;
    rewrite ^/app/(.*)$ /$1 break;
    proxy_pass http://campus_prototype;
    include /etc/nginx/campus-proxy-common.conf;
}

location = /app/api/works/preview-image {
    limit_req zone=campus_api burst=20 nodelay;
    limit_req_status 429;
    client_max_body_size 10m;
    proxy_pass http://campus_prototype/api/works/preview-image;
    include /etc/nginx/campus-proxy-common.conf;
}

location = /app/api/works/upload {
    limit_req zone=campus_api burst=10 nodelay;
    limit_req_status 429;
    client_max_body_size 50m;
    proxy_pass http://campus_prototype/api/works/upload;
    include /etc/nginx/campus-proxy-common.conf;
}

location /app/api/reset {
    return 404;
}

location /app/ {
    limit_req zone=campus_api burst=60 nodelay;
    limit_req_status 429;
    limit_conn campus_conn 50;
    client_max_body_size 64k;
    proxy_pass http://campus_prototype/;
    include /etc/nginx/campus-proxy-common.conf;
}
