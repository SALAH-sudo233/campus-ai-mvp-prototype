# http 级配置，放到 /etc/nginx/conf.d/campus-http.conf。
limit_req_zone $binary_remote_addr zone=campus_register:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=campus_login:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=campus_admin:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=campus_api:10m rate=60r/m;
limit_conn_zone $binary_remote_addr zone=campus_conn:10m;

upstream campus_prototype {
    server 127.0.0.1:8080 max_fails=3 fail_timeout=10s;
    keepalive 8;
}
