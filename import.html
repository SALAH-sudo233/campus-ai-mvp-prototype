<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>成员管理</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <header class="topbar teacher-topbar">
    <div class="wordmark"><span class="brand-mark small">AI</span><span data-product-name>创作平台</span><span class="muted">教师端</span></div>
    <nav class="topnav hidden" id="teacherNav"><a class="navbtn" id="dashboardLink" href="teacher.html">教学看板</a><button class="navbtn active">成员管理</button><a class="navbtn" id="galleryLink" href="gallery.html">作品广场</a></nav>
    <div class="user-menu"><span id="teacherOrg"></span><button class="ghost hidden" id="teacherLogout">退出</button></div>
  </header>

  <main class="content import-content">
    <section id="importDenied" class="panel denied hidden">
      <h2>需要教师权限</h2><p class="muted">请使用老师账号登录后访问教师端。</p><a class="primary link-btn" id="importBackLogin" href="index.html">回到登录页</a>
    </section>

    <section id="importMain" class="hidden">
      <div class="page-head compact-head"><div><p class="eyebrow">MEMBER DIRECTORY</p><h2>成员管理</h2><p class="muted">查看与搜索本组织成员信息。</p></div></div>

      <section class="panel member-panel">
        <div class="panel-head"><div><h3>成员列表</h3><p class="muted">姓名、学号、角色、用量、密钥掩码与准入状态（仅展示）</p></div><div class="inline-actions"><input id="memberSearch" placeholder="搜索姓名 / 学号 / 邮箱" /><button class="outline" id="memberSearchBtn">搜索</button></div></div>
        <div class="table-scroll"><table class="data-table" id="memberTable"></table></div>
      </section>
    </section>
  </main>
  <script src="components.js"></script>
  <script src="import.js"></script>
</body>
</html>
