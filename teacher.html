<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>教师端</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <header class="topbar teacher-topbar">
    <div class="wordmark"><span class="brand-mark small">AI</span><span data-product-name>创作平台</span><span class="muted">教师端</span></div>
    <nav class="topnav hidden" id="teacherNav"><button class="navbtn active">教学看板</button><a class="navbtn" id="importLink" href="import.html">成员管理</a><a class="navbtn" href="gallery.html">作品广场</a><button class="ghost" data-agent-tools>获取我的 agent 工具包</button></nav>
    <div class="user-menu"><span id="teacherOrg"></span><button class="ghost hidden" id="teacherLogout">退出</button></div>
  </header>

  <main class="content teacher-content">
    <section id="teacherDenied" class="panel denied hidden">
      <h2>需要教师权限</h2><p class="muted">请使用老师账号登录后访问教师端。</p><a class="primary link-btn" id="teacherBackLogin" href="index.html">回到登录页</a>
    </section>

    <section id="teacherMain" class="hidden">
      <div class="page-head"><div><p class="eyebrow">TEACHING OVERVIEW</p><h2 id="orgTitle">组织总览</h2><p class="muted" id="orgSubtitle">本组织成员、用量与精选作品</p></div><a class="outline link-btn" id="importBtn" href="import.html">成员管理</a></div>
      <div id="teacherError" class="data-unavailable hidden"></div>
      <div class="stats" id="teacherStats"></div>
      <div class="grid teacher-grid">
        <section class="panel"><div class="panel-head"><div><h3>用量趋势</h3><p class="muted">按天聚合，保留近 90 天</p></div><span class="badge active">Token</span></div><div id="trendChart"></div></section>
        <aside class="panel"><h3>活跃度分布</h3><div id="activityChart"></div><h3 class="section-title">近 90 天热力</h3><div id="heatmap"></div></aside>
      </div>
      <section class="panel"><div class="panel-head"><div><h3>额度消耗排行</h3><p class="muted">本组织成员，近 90 天</p></div></div><div class="table-scroll"><table class="data-table" id="rankingTable"></table></div></section>
      <section class="panel">
        <div class="panel-head"><div><h3>精选作品</h3><p class="muted">学生提交后只在本组织内展示，可按状态和软件类型快速筛选</p></div><div class="inline-actions"><a class="outline link-btn" id="galleryEntry" href="gallery.html">作品广场 →</a><button class="outline" id="refreshWorks">刷新</button></div></div>
        <div class="teacher-works-toolbar">
          <div class="ph-sorts" id="teacherWorkTabs" role="tablist" aria-label="作品状态筛选"></div>
          <div class="ph-cats" id="teacherWorkTypes" role="tablist" aria-label="软件类型筛选"></div>
        </div>
        <div id="pendingWorks" class="work-grid"></div>
      </section>
      <section class="panel"><div class="panel-head"><div><h3>操作审计</h3><p class="muted">不含密钥明文</p></div><button class="ghost" id="refreshAudit">刷新</button></div><div class="table-scroll"><table class="data-table" id="auditTable"></table></div></section>
    </section>
  </main>
  <script src="components.js"></script>
  <script src="teacher.js"></script>
  <script src="agent-tools.js"></script>
</body>
</html>
